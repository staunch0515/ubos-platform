version: '3.8'

services:
  # 1. 数据库服务
  db:
    image: postgres:15
    container_name: ubos-postgres
    restart: always
    environment:
      POSTGRES_DB: ubos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password_ubos  # ⚠️ Use a production-like password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  # 2. UBOS JAVA 内核服务 (后端 API)
  ubos-server:
    build:
      context: . # Look for Dockerfile in the current directory
      dockerfile: Dockerfile
    container_name: ubos-server
    restart: on-failure
    environment:
      # ⚠️ 覆盖配置：指向 Docker 内部的 db 服务名
      SPRING_R2DBC_URL: r2dbc:postgresql://db:5432/ubos_db
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: password_ubos
      MANAGEMENT_ENDPOINT_SHUTDOWN_ENABLED: "true"
    ports:
      - "8080:8080" # 暴露 API 端口
    depends_on:
      - db

  # 3. UBOS PYTHON Copilot (前端/AI Agent)
  ubos-copilot:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ubos-copilot
    restart: on-failure
    environment:
      # ⚠️ 必须设置给 Python Agent，让它知道 Java API 的地址
      UBOS_API_URL: http://ubos-server:8080/api
      OPENAI_API_KEY: ${OPENAI_API_KEY} # 从本地环境变量获取 Key
    ports:
      - "8501:8501" # 暴露 Streamlit UI 端口
    depends_on:
      - ubos-server # 确保 Java 服务启动后再启动 Copilot

volumes:
  pg_data:

# ------------------------------------------
# 3. 补充 requirements.txt
# ------------------------------------------

# 请在 ubos-copilot 目录下创建 requirements.txt 文件：
# ubos-copilot/requirements.txt
# (用于 Dockerfile.frontend 安装依赖)

# requests
# openai
# streamlit
# pandas