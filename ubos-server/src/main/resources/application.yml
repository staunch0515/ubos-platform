server:
  port: 8080

spring:
  application:
    name: ubos-platform

  # R2DBC 响应式数据库配置
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/ubos_db
    username: postgres
    password: root # 请修改为您的实际密码
    pool:
      initial-size: 5
      max-size: 20

  # Flyway 迁移配置 (使用 JDBC 驱动，仅用于启动时建表)
  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5432/ubos_db
    user: postgres
    password: root
    locations: "classpath:db/migration"

# 日志级别
logging:
  level:
    com.ubos: DEBUG
    org.springframework.r2dbc: INFO


management:
  endpoint:
    shutdown:
      enabled: true # 允许远程关机
  endpoints:
    web:
      exposure:
        include: "*"